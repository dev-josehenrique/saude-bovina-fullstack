<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guia de testes da API — SGDSB</title>
<meta name="description" content="Roteiro de testes da API do SGDSB para fazer no Insomnia: rotas, corpos, respostas esperadas e botões de copiar.">
<style>
:root{
  --bg:#f6f7f4;--sf:#ffffff;--sf2:#f0f3ee;--tx:#17231c;--mu:#5d6b62;--bd:#e0e6df;
  --brand:#1f6b43;--brand-strong:#17553a;--brand-soft:#e4f1e8;
  --get:#2454a6;--post:#1f6b43;--put:#a35f00;--del:#b3261e;
  --ok-bg:#e4f1e8;--ok:#17553a;--warn-bg:#fff1dc;--warn:#8a5200;--err-bg:#fdeceb;--err:#b3261e;--info-bg:#e8f0fb;--info:#2454a6;
  --code:#f3f5f1;--ring:0 0 0 3px rgba(31,107,67,.3);--radius:12px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0f1613;--sf:#17211c;--sf2:#1d2a23;--tx:#e9f0eb;--mu:#93a49a;--bd:#2a3a31;
    --brand:#4fbf83;--brand-strong:#6fd39c;--brand-soft:#1b3327;
    --get:#8db4f5;--post:#4fbf83;--put:#e0a04d;--del:#ff8b82;
    --ok-bg:#1b3327;--ok:#6fd39c;--warn-bg:#3a2c12;--warn:#e0a04d;--err-bg:#3a1e1c;--err:#ff8b82;--info-bg:#1b2a45;--info:#8db4f5;
    --code:#101a15;--ring:0 0 0 3px rgba(79,191,131,.35);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased}
h1,h2,h3{line-height:1.2;letter-spacing:-.02em;margin:0}
p{margin:0}
code,pre{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;font-size:.86rem}
:focus-visible{outline:none;box-shadow:var(--ring);border-radius:8px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* topo fixo */
input:focus{outline:none;border-color:var(--brand);box-shadow:var(--ring)}
.btn{font:inherit;font-size:.86rem;font-weight:600;color:var(--tx);background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:.45rem .8rem;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--sf2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-strong)}

/* layout */
.layout{max-width:1200px;margin:auto;padding:1.25rem 1rem 5rem;display:grid;grid-template-columns:230px minmax(0,1fr);gap:1.5rem}
.lateral{position:sticky;top:16px;align-self:start;max-height:calc(100vh - 32px);overflow:auto;display:flex;flex-direction:column;gap:.15rem}
.lateral a{display:flex;justify-content:space-between;gap:.5rem;padding:.45rem .7rem;border-radius:9px;color:var(--mu);text-decoration:none;font-size:.9rem;font-weight:600}
.lateral a:hover{background:var(--sf2);color:var(--tx)}
.lateral a.ativo{background:var(--brand-soft);color:var(--brand-strong)}
.lateral small{font-variant-numeric:tabular-nums;font-weight:500}
@media (max-width:900px){
  .layout{grid-template-columns:1fr}
  .lateral{position:static;flex-direction:row;overflow-x:auto;max-height:none;padding-bottom:.3rem}
  .lateral a{white-space:nowrap}
}
main{display:flex;flex-direction:column;gap:1.75rem;min-width:0}
section.secao{scroll-margin-top:16px}
section.secao>h2{font-size:1.35rem;display:flex;align-items:center;gap:.6rem;margin-bottom:.4rem}
.num{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--brand);color:#fff;font-size:.85rem;font-weight:800;flex:none}
.intro{color:var(--mu);margin-bottom:.9rem}

/* painel de preparação */
.painel{background:var(--sf);border:1px solid var(--bd);border-radius:var(--radius);padding:1.25rem;display:flex;flex-direction:column;gap:1rem}
.painel h2{font-size:1.2rem}
.legenda{display:flex;gap:.5rem 1rem;flex-wrap:wrap;font-size:.85rem;color:var(--mu);align-items:center}

/* cartão de rota */
details.rota{background:var(--sf);border:1px solid var(--bd);border-radius:var(--radius);margin-bottom:.7rem;overflow:hidden}
details.rota[open]{border-color:color-mix(in srgb,var(--brand) 45%,var(--bd))}
details.rota>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:.75rem;padding:.8rem 1rem}
details.rota>summary::-webkit-details-marker{display:none}
details.rota>summary:hover{background:var(--sf2)}
.metodo{display:inline-block;min-width:64px;text-align:center;font-weight:800;font-size:.76rem;letter-spacing:.04em;padding:.25rem .5rem;border-radius:7px;color:#fff;flex:none}
.metodo.peq{min-width:52px;font-size:.7rem;padding:.2rem .4rem}
.m-GET{background:var(--get)}.m-POST{background:var(--post)}.m-PUT{background:var(--put)}.m-DELETE{background:var(--del)}
@media (prefers-color-scheme:dark){.metodo{color:#0f1613}}
.info{display:flex;flex-direction:column;min-width:0;flex:1}
.info .caminho{font-weight:700;overflow-wrap:anywhere}
.info .titulo{font-size:.88rem;color:var(--mu)}
.contagem{font-size:.8rem;color:var(--mu);font-variant-numeric:tabular-nums;white-space:nowrap}
.contagem.completo{color:var(--ok);font-weight:700}
.cp{font:inherit;font-size:.78rem;font-weight:700;color:var(--brand-strong);background:var(--brand-soft);border:1px solid transparent;border-radius:8px;padding:.3rem .6rem;cursor:pointer;white-space:nowrap;flex:none}
.cp:hover{border-color:var(--brand)}
.cp.copiado{background:var(--brand);color:#fff}
.corpo{padding:.2rem 1rem 1.1rem;display:flex;flex-direction:column;gap:.75rem;border-top:1px solid var(--bd)}
.corpo>p:first-child{margin-top:.8rem}
.simples{font-size:1rem}
.dica,.fala,.aviso{font-size:.9rem;padding:.6rem .8rem;border-radius:10px}
.dica{background:var(--info-bg);color:var(--info)}
.fala{background:var(--sf2)}
.aviso{background:var(--warn-bg);color:var(--warn);font-weight:600}
.tags{display:flex;gap:.4rem;flex-wrap:wrap}
.tag{font-size:.74rem;font-weight:700;padding:.15rem .55rem;border-radius:999px;background:var(--sf2);color:var(--mu);border:1px solid var(--bd)}
.corpo h3{font-size:.95rem;margin-top:.3rem}

/* casos de teste */
.caso{border:1px solid var(--bd);border-radius:10px;padding:.75rem .85rem;display:flex;flex-direction:column;gap:.55rem;background:var(--bg)}
.caso.feito{border-color:color-mix(in srgb,var(--brand) 55%,var(--bd));background:color-mix(in srgb,var(--brand-soft) 55%,var(--bg))}
.caso-topo{display:flex;align-items:center;justify-content:space-between;gap:.75rem}
.chk{display:flex;align-items:center;gap:.55rem;font-weight:700;cursor:pointer}
.chk input{width:1.15rem;height:1.15rem;accent-color:var(--brand);cursor:pointer;flex:none}
.st{font-weight:800;font-size:.8rem;padding:.15rem .55rem;border-radius:7px;font-variant-numeric:tabular-nums;flex:none}
.st2{background:var(--ok-bg);color:var(--ok)}.st4{background:var(--warn-bg);color:var(--warn)}.st5{background:var(--err-bg);color:var(--err)}
.como{font-size:.88rem;color:var(--mu)}
.linha-req{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.linha-req code.url{flex:1;min-width:0;overflow-wrap:anywhere;background:var(--code);border:1px solid var(--bd);border-radius:8px;padding:.3rem .55rem}
.auth{font-size:.86rem;color:var(--mu);display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.bloco{border:1px solid var(--bd);border-radius:8px;overflow:hidden}
.bloco-topo{display:flex;justify-content:space-between;align-items:center;gap:.5rem;padding:.3rem .55rem;background:var(--sf2);font-size:.76rem;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.04em}
pre{margin:0;padding:.6rem .75rem;background:var(--code);overflow:auto;max-height:340px;white-space:pre}
details.resp>summary{cursor:pointer;font-size:.86rem;font-weight:700;color:var(--brand-strong);display:flex;align-items:center;gap:.5rem;list-style:none}
details.resp>summary::-webkit-details-marker{display:none}
details.resp>summary::before{content:"▸";transition:transform .15s}
details.resp[open]>summary::before{transform:rotate(90deg)}
details.resp pre{margin-top:.5rem;border:1px solid var(--bd);border-radius:8px}
.nota{font-size:.8rem;color:var(--mu);margin-top:.35rem}
.vazio{padding:2rem;text-align:center;color:var(--mu)}
.toast{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%) translateY(20px);background:var(--brand);color:#fff;padding:.5rem 1rem;border-radius:999px;font-weight:700;font-size:.88rem;opacity:0;pointer-events:none;transition:.2s;z-index:50}
.toast.on{opacity:1;transform:translateX(-50%)}
footer{max-width:1200px;margin:0 auto;padding:0 1rem 3rem;color:var(--mu);font-size:.85rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
@media print{.topo,.lateral,.cp,.toast{display:none}.layout{display:block}details.rota{break-inside:avoid}}
</style>
</head>
<body>

<div class="layout">
  <nav class="lateral" id="nav" aria-label="Seções"></nav>

  <main>
    <section class="painel" id="preparacao" aria-label="Legenda">

      <div class="legenda">
        <span>Legenda:</span>
        <span class="metodo peq m-GET">GET</span> ler
        <span class="metodo peq m-POST">POST</span> criar
        <span class="metodo peq m-PUT">PUT</span> alterar
        <span class="metodo peq m-DELETE">DELETE</span> apagar
        <span class="st st2">2xx</span> deu certo
      </div>
    </section>

    <div id="conteudo"></div>
  </main>
</div>

<footer>
  As respostas mostradas são exemplos reais, obtidos rodando cada teste na API: ids, datas e horários mudam a cada execução.
  Listas longas aparecem resumidas (só os 2 primeiros itens). Guia gerado em <span id="gerado"></span>.
</footer>

const fill = function fill(v, V) {
  if (typeof v === 'string') {
    const m = v.match(/^\{(\w+)\}$/);
    if (m && m[1] in V) return V[m[1]];
    return v.replace(/\{(\w+)\}/g, (s, k) => (k in V ? V[k] : s));
  }
  if (Array.isArray(v)) return v.map((x) => fill(x, V));
  if (v && typeof v === 'object') return Object.fromEntries(Object.entries(v).map(([k, x]) => [k, fill(x, V)]));
  return v;
};

function corpoDe(r, c, v) {
  if (c.corpoBruto !== undefined) return c.corpoBruto;
  const src = c.corpo !== undefined ? c.corpo : r.corpo;
  return src === undefined ? null : JSON.stringify(fill(src, v), null, 2);
}

function textoCopiar(act, rid, ci) {
  const r = ROTAS[rid], c = ci >= 0 ? r.casos[ci] : null, v = vars();
  if (act === 'url') return baseUrl() + fill((c && c.caminho) ?? r.caminho, v);
  if (act === 'body') return corpoDe(r, c, v);
  if (act === 'auth') return valorAuth();
  if (act === 'falso') return 'Bearer abc';
  if (act === 'ct') return 'application/json';
  return '';
}

function casoHTML(r, c, i, v) {
  const id = `${r.id}:${i}`;
  const url = baseUrl() + fill(c.caminho ?? r.caminho, v);
  const corpo = corpoDe(r, c, v);
  const real = c.real;
  let auth;
  if (c.auth === 'invalido') auth = `⚠️ Token falso: header <code>Authorization: Bearer abc</code> <button class="cp" type="button" data-act="falso" data-r="${r.id}" data-c="${i}">Copiar valor</button>`;
  else if (c.auth === false && !r.publica) auth = '🚫 Sem token: desmarque ou apague o header <code>Authorization</code>.';
  else if (r.publica) auth = '🔓 Rota pública: não precisa de token.';
  else auth = `🔒 Header <code>Authorization</code> com o token do login <button class="cp" type="button" data-act="auth" data-r="${r.id}" data-c="${i}">Copiar valor</button>`;
  const faixa = String(c.status)[0];
  const resp = real
    ? `<details class="resp" data-key="resp:${id}" ${S.open['resp:' + id] ? 'open' : ''}><summary>Ver resposta esperada <span class="st st${faixa}">${c.status}</span></summary>
         <pre>${real.body === null ? '(resposta vazia, sem corpo)' : esc(JSON.stringify(real.body, null, 2))}</pre>
         ${real.cortado ? '<p class="nota">Lista resumida: a API devolve todos os itens, aqui aparecem só os 2 primeiros.</p>' : ''}</details>`
    : '';
  return `<div class="caso ${S.done[id] ? 'feito' : ''}" data-caso="${id}">
    <div class="caso-topo">
      <label class="chk"><input type="checkbox" data-chk="${id}" ${S.done[id] ? 'checked' : ''}><span>${esc(c.nome)}</span></label>
      <span class="st st${faixa}" title="Status HTTP esperado">${c.status}</span>
    </div>
    ${c.como ? `<p class="como">▶ ${esc(c.como)}</p>` : ''}
    <div class="linha-req"><span class="metodo peq m-${r.metodo}">${r.metodo}</span><code class="url">${esc(url)}</code>
      <button class="cp" type="button" data-act="url" data-r="${r.id}" data-c="${i}">Copiar URL</button></div>
    <p class="auth">${auth}</p>
    ${corpo !== null ? `<p class="auth">📎 Header <code>Content-Type</code> com o valor <code>application/json</code> <button class="cp" type="button" data-act="ct" data-r="${r.id}" data-c="${i}">Copiar valor</button></p>` : ''}
    ${corpo !== null ? `<div class="bloco"><div class="bloco-topo"><span>Body (JSON)</span><button class="cp" type="button" data-act="body" data-r="${r.id}" data-c="${i}">Copiar corpo</button></div><pre>${esc(corpo)}</pre></div>` : ''}
    ${resp}
  </div>`;
}

function rotaHTML(r, v) {

async function copiar(texto, btn) {
  try { await navigator.clipboard.writeText(texto); }
  catch {
    const t = document.createElement('textarea'); t.value = texto; t.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(t); t.select();
    try { document.execCommand('copy'); } catch {} t.remove();
  }
  if (btn) { const antes = btn.textContent; btn.classList.add('copiado'); btn.textContent = 'Copiado ✓'; setTimeout(() => { btn.classList.remove('copiado'); btn.textContent = antes; }, 1200); }
  toast('Copiado ✓');
}

});

}

render();
</script>
